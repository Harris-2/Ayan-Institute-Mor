<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
</head>
<body class="">
    <h1>User Cart</h1>
    <div>
        <input type="text" placeholder="Enter Product name" id="productName">
        <input type="text" placeholder="Enter Price" id="productPrice">
        <button onclick="addToCart()">Add to cart</button>

        <ul id="cartItems"></ul>
    </div>

    <script>
        function additem(productName, productPrice){
            const cartList = document.getElementById('cartItems');
            const newItem = document.createElement('li');
            newItem.textContent = `${productName} ' / ' Rs${productPrice}`
            newItem.className = 'cartItems';
            cartList.appendChild(newItem)
        }

        function addToCart(){
            const productName = document.getElementById('productName').value;
            const productPrice = document.getElementById('productPrice').value;
            additem(productName, productPrice);
        }
    </script>
</body>
</html>
